# typos configuration for the gate's `typos` phase.
#
# Passed as `--config` on BOTH lanes, and -- unlike the gitleaks `-c` next door -- always,
# including over a repository that ships a `_typos.toml` of its own. Measured, because the
# two flags do not mean the same thing: gitleaks' `-c` REPLACES the repo's file, while
# typos layers this one on top of the config it discovers by walking up from the scanned
# path. A fixture with `[default.extend-words] teh = "teh"` still silenced `teh` with this
# file present, and a fixture with its own `extend-ignore-re` kept ITS pattern while the
# hash below stayed ignored -- the two lists merge, neither wins.
#
# Nothing here is a dictionary word: an English word declared correct is a repository's
# call, and this file is applied to every repository on the machine.
[default]
# A git hash is not prose. `6129afe` in a plan document is a real commit
# (`git rev-parse` resolves it), typos splits the identifier at the digits and reports the
# `afe` tail as a misspelling of `safe` -- and "correcting" it destroys the reference. The
# same run reported `ede` inside a go.mod pseudo-version (`v0.0.0-<date>-<12 hex>`), which
# is the same token wearing a different suffix. Every repository the gate runs on puts
# hashes in docs, plans and lockfiles, so this cannot be each repository's own `afe =
# "afe"` -- that spelling also switches the word off everywhere, prose included.
#
# 7..40 lowercase hex: `git rev-parse --short` starts at 7 and a full SHA-1 is 40. Bounded
# by \b, so it is the WHOLE token or nothing -- `afe` alone in prose is still a finding,
# and so is every word with a non-hex letter in it. What it does cost: an all-hex English
# word of 7+ letters (`defaced`, `effaced`) is no longer spell-checked. Both are spelled
# correctly, and a typo that lands on another all-hex string is not a shape typos would
# have corrected anyway. Lowercase only -- uppercase hex is a constant, not a commit.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]
