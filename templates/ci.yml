# Quality gate on every push and pull request. Installed by `qgate wire`.
#
# The gate is pinned to a TAG, never to main: on a branch the same commit can
# pass today and fail tomorrow with no change to this repo.
name: quality-gate

on:
  push:
  pull_request:

env:
  QG_REF: v1

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # -Baseline needs history

      - name: detect stacks
        id: stacks
        shell: pwsh
        run: |
          # A monorepo has no marker at the root: find where each stack actually
          # lives and hand setup-go the go.mod that exists, not an assumed one.
          $gomod = Get-ChildItem -Recurse -Depth 3 -Filter go.mod -File -EA SilentlyContinue |
                   Select-Object -First 1
          $pkg = Get-ChildItem -Recurse -Depth 3 -Filter package.json -File -EA SilentlyContinue |
                 Where-Object { $_.FullName -notmatch '\\node_modules\\' } | Select-Object -First 1
          $web = $null -ne $pkg
          if ($pkg) {
            "webdir=$(($pkg.DirectoryName.Substring($PWD.Path.Length).Trim('\') -replace '\\', '/'))" |
              Add-Content $env:GITHUB_OUTPUT
          }
          $rust = [bool](Get-ChildItem -Recurse -Depth 3 -Filter Cargo.toml -File -EA SilentlyContinue)
          "go=$(($null -ne $gomod).ToString().ToLower())" | Add-Content $env:GITHUB_OUTPUT
          if ($gomod) {
            "gomod=$($gomod.FullName.Substring($PWD.Path.Length + 1) -replace '\\', '/')" | Add-Content $env:GITHUB_OUTPUT
          }
          "web=$($web.ToString().ToLower())"   | Add-Content $env:GITHUB_OUTPUT
          "rust=$($rust.ToString().ToLower())" | Add-Content $env:GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        if: steps.stacks.outputs.go == 'true'
        with:
          go-version-file: ${{ steps.stacks.outputs.gomod }}

      # The full level requires golangci-lint; without it the gate fails closed.
      - name: install golangci-lint
        if: steps.stacks.outputs.go == 'true'
        shell: pwsh
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: install govulncheck
        if: steps.stacks.outputs.go == 'true'
        shell: pwsh
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - uses: actions/setup-node@v4
        if: steps.stacks.outputs.web == 'true'
        with:
          node-version: lts/*

      - name: npm ci
        if: steps.stacks.outputs.web == 'true'
        shell: pwsh
        working-directory: ${{ steps.stacks.outputs.webdir || '.' }}
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        if: steps.stacks.outputs.rust == 'true'
        with:
          components: clippy, rustfmt

      - name: install quality-gate
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:QG_REF https://github.com/UberMorgott/quality-gate.git $env:RUNNER_TEMP\quality-gate
          # bootstrap.ps1 is for developer machines; CI only needs it on PATH.
          "$env:RUNNER_TEMP\quality-gate\bin" | Add-Content -Path $env:GITHUB_PATH

      - name: qgate
        shell: pwsh
        run: qgate -All -Full
