# Lefthook owns the git hook wiring; this gate owns the checks.
# Installed by `qgate wire`, activated by `lefthook install`.
#
# VERIFIED TRAP (lefthook 2.1.12, Windows): a job written as
#   run: pwsh -NoProfile -Command "exit 1"
# is reported as SUCCESS -- the exit code is swallowed. A bare executable
# propagates it correctly, and so does `pwsh -NoProfile -File <script>`. Never
# -Command, never wrapped in `cmd /c` (also swallows it). Related: lefthook
# issue #1256.
pre-commit:
  jobs:
    - name: quality-gate
      run: qgate -All -Full

# The agent Stop hook is deliberately NOT generated through lefthook's `ai:`
# key. Measured on 2.1.12: the generated command is `lefthook run <hook>`, which
# exits 1 on failure -- but Claude Code only blocks the turn on exit **2**, so
# the generated wiring runs the gate and then lets the agent finish anyway. It
# also has no retry cap. `qgate stop-hook` does both, and `qgate wire` puts it
# into .claude/settings.json for you.
